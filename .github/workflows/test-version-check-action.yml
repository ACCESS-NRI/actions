# Workflow to test the version-check action
name: Test version check action
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/actions/version-check/**'
      - '.github/workflows/test-version-check-action.yml'
# To test the action by pushing tags
# Uncomment this and push tag: v1.2.3
  push: 
    tags:
      - '**'

env:
  TAG_NAME: v1.2.3
  PREVIOUS_TAG_NAME: v1.2.2

jobs:
  sanity-check:
    name: Sanity check on pushed tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    env:
      PUSHED_TAG: ${{ github.ref_name }}
    steps:
      - name: Check pushed tag
        run: |
          if [[ "$PUSHED_TAG" != "$TAG_NAME" ]]; then
            echo "::error::Expected tag: $TAG_NAME | Got: $PUSHED_TAG | This workflow can only be tested by pushing tag $TAG_NAME"
            exit 1
          fi

  test-action-always:
    name: Test ${{ matrix.id }} - ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 1
            label: "Semver patch increment"
            description: |
              Test action for a semver versioning scheme when version and previous-version 
              inputs are both provided and the new version is a patch increment.
              Test expected to succeed.
            inputs: >-
                "versioning-scheme": "semver",
                "previous-version": "1.1.3",
                "version": "1.1.4"
            outcome: "success"
          - id: 2
            label: "Semver minor increment"
            description: |
              Test action for a semver versioning scheme when version and previous-version 
              inputs are both provided and the new version is a minor increment.
              Test expected to succeed.
            inputs: >-
                "versioning-scheme": "semver",
                "previous-version": "1.1.3",
                "version": "1.2.0"
            outcome: "success"
          - id: 3
            label: "Semver major increment"
            description: |
              Test action for a semver versioning scheme when version and previous-version 
              inputs are both provided and the new version is a major increment.
              Test expected to succeed.
            inputs: >-
                "versioning-scheme": "semver",
                "previous-version": "1.1.3",
                "version": "2.0.0"
            outcome: "success"
          - id: 4
            label: "Semver-major-minor minor increment"
            description: |
              Test action for a semver-major-minor versioning scheme when version and previous-version 
              inputs are both provided and the new version is a minor increment.
              Test expected to succeed.
            inputs: >-
                "versioning-scheme": "semver-major-minor",
                "previous-version": "1.1",
                "version": "1.2"
            outcome: "success"
          - id: 5
            label: "Semver-major-minor major increment"
            description: |
              Test action for a semver-major-minor versioning scheme when version and previous-version 
              inputs are both provided and the new version is a major increment.
              Test expected to succeed.
            inputs: >-
                "versioning-scheme": "semver-major-minor",
                "previous-version": "1.1",
                "version": "2.0"
            outcome: "success"
          - id: 6
            label: "Semver failure jump"
            description: |
              Test action for a semver versioning scheme when version has a jump.
              Test expected to fail.
            inputs: >-
                "versioning-scheme": "semver",
                "previous-version": "1.1.3",
                "version": "1.3.0"
            outcome: "failure"
          - id: 7
            label: "Semver failure not greater"
            description: |
              Test action for a semver versioning scheme when version is not greater than previous-version.
              Test expected to fail.
            inputs: >-
                "versioning-scheme": "semver",
                "previous-version": "1.1.3",
                "version": "1.1.3"
            outcome: "failure"
          - id: 8
            label: "Semver-major-minor failure jump"
            description: |
              Test action for a semver-major-minor versioning scheme when version has a jump.
              Test expected to fail.
            inputs: >-
                "versioning-scheme": "semver-major-minor",
                "previous-version": "1.1",
                "version": "1.3"
            outcome: "failure"
          - id: 9
            label: "Semver-major-minor failure not greater"
            description: |
              Test action for a semver-major-minor versioning scheme when version is not greater than previous-version.
              Test expected to fail.
            inputs: >-
                "versioning-scheme": "semver-major-minor",
                "previous-version": "1.1",
                "version": "1.1"
            outcome: "failure"
          - id: 10
            label: "Semver failure wrong format"
            description: |
              Test action for semver versioning scheme when the format is not correct.
            inputs: >-
                "versioning-scheme": "semver",
                "version": "2.1"
            outcome: "failure"
          - id: 11
            label: "Semver-major-minor failure wrong format"
            description: |
              Test action for semver-major-minor versioning scheme when the format is not correct.
            inputs: >-
                "versioning-scheme": "semver-major-minor",
                "version": "2.1.0",
                "previous-version": "2.0"
            outcome: "failure"
          - id: 12
            label: "Failure wrong versioning scheme"
            description: |
              Test action when a non-supported versioning scheme is provided
            inputs: >-
                "versioning-scheme": "unsupported-scheme"
            outcome: "failure"
          - id: 13
            label: "Success prefix handling"
            description: |
              Test action when a prefix is provided both in version and previous-version,
              and the version string matches the expected format.
            inputs: >-
                "versioning-scheme": "semver",
                "version": "v2.1.1",
                "previous-version": "v2.1.0",
                "prefix": "v"
            outcome: "success"
          - id: 14
            label: "Success prefix handling, previous-version with no prefix"
            description: |
              Test action when a prefix is provided only in version,
              and the version string matches the expected format.
            inputs: >-
                "versioning-scheme": "semver-major-minor",
                "version": "v1.5",
                "previous-version": "1.4",
                "prefix": "v"
            outcome: "success"
          - id: 15
            label: "Failure wrong prefix"
            description: |
              Test action when a prefix is provided but it doesn't match
              the one in version.
            inputs: >-
                "versioning-scheme": "semver",
                "version": "v2.1.1",
                "previous-version": "2.1.0",
                "prefix": "x"
            outcome: "failure"
          - id: 16
            label: "Failure no prefix but version has prefix"
            description: |
              Test action when a prefix is not provided but the version string has a prefix.
            inputs: >-
                "versioning-scheme": "semver",
                "version": "p1.1.4",
                "previous-version": "1.1.3"
            outcome: "failure"
          - id: 17
            label: "Failure prefix provided but version has no prefix"
            description: |
              Test action when a prefix is provided but the version string has no prefix.
            inputs: >-
                "versioning-scheme": "semver",
                "version": "1.1.4",
                "previous-version": "1.1.3",
                "prefix": "some"
            outcome: "failure"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Description
        run: echo "${{ matrix.description }}"

      - name: Test
        id: test-action
        continue-on-error: true
        uses: jenseng/dynamic-uses@8bc24f0360175e710da532c4d19eafdbed489a06 #v1.1.1 - Needed because github context is not supported within step.uses (https://github.com/actions/runner/issues/895)
        with: 
          uses: ${{ github.repository }}/.github/actions/version-check@${{github.sha}}
          with: '{ ${{ matrix.inputs }} }'
    
      - name: Verify expected outcome
        if: always()
        run: |
          if [[ '${{ matrix.outcome }}' == '${{ steps.test-action.outcome }}' ]]; then
            exit 0
          else
            exit 1
          fi
    
  test-action-tag-push-no-previous-version:
    name: Test ${{ matrix.id }} - ${{ matrix.label }}
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: sanity-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 18
            label: "Version and previous-version not provided"
            description: |
              Test action triggered by tag push, for a semver versioning scheme 
              when none of the version or previous-version inputs are provided.
              No previous version tag exists.
              Test expected to succeed.
            inputs: >-
                "versioning-scheme": "semver",
                "prefix": "v"
            outcome: "success"
          - id: 19
            label: "Previous-version provided, version not provided"
            description: |
              Test action triggered by tag push, for a semver versioning scheme 
              when the version input is not provided but the previous-version input is provided.
              No previous version tag exists.
              Test expected to succeed.
            inputs: >-
                "versioning-scheme": "semver",
                "previous-version": "v1.2.2",
                "prefix": "v"
            outcome: "success"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      
      - name: Description
        run: echo "${{ matrix.description }}"

      - name: Test
        id: test-action
        continue-on-error: true
        uses: jenseng/dynamic-uses@8bc24f0360175e710da532c4d19eafdbed489a06 #v1.1.1 - Needed because github context is not supported within step.uses (https://github.com/actions/runner/issues/895)
        with: 
          uses: ${{ github.repository }}/.github/actions/version-check@${{github.sha}}
          with: '{ ${{ matrix.inputs }} }'
    
      - name: Verify expected outcome
        if: always()
        run: |
          if [[ '${{ matrix.outcome }}' == '${{ steps.test-action.outcome }}' ]]; then
            exit 0
          else
            exit 1
          fi

  create-previous-version-tag:
    name: Create previous version tag
    runs-on: ubuntu-latest
    # Also trigger if test-action-tag-push-no-previous-version fails
    if: >
      always() && 
      startsWith(github.ref, 'refs/tags/') &&
      needs.sanity-check.result == 'success'
    needs: [sanity-check, test-action-tag-push-no-previous-version]
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create previous-version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$PREVIOUS_TAG_NAME" -m '[skip ci]'
          git push origin "$PREVIOUS_TAG_NAME"
  
  test-action-tag-push-with-previous-version:
    name: Test ${{ matrix.id }} - ${{ matrix.label }}
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: create-previous-version-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 20
            label: "Version and previous-version not provided"
            description: |
              Test action triggered by tag push, for a semver versioning scheme 
              when none of the version or previous-version inputs are provided.
              Previous version tag exists.
              Test expected to succeed.
            inputs: >-
                "versioning-scheme": "semver",
                "prefix": "v"
            outcome: "success"
          - id: 21
            label: "Incorrect previous-version provided"
            description: |
              Test action triggered by tag push, for a semver versioning scheme 
              when an incorrect previous-version input is provided, and no version input is provided.
              Previous version tag exists.
              Test expected to fail.
            inputs: >-
                "versioning-scheme": "semver",
                "previous-version": "v0.1.2",
                "prefix": "v"
            outcome: "failure"
          - id: 22
            label: "Matching version provided, previous-version not provided"
            description: |
              Test action triggered by tag push, for a semver versioning scheme 
              when a version input is provided and no previous-version input is provided.
              Previous version tag exists.
              Test expected to succeed.
            inputs: >-
                "versioning-scheme": "semver",
                "version": "v1.2.4",
                "prefix": "v"
            outcome: "success"
          - id: 23
            label: "Version provided, previous-version provided"
            description: |
              Test action triggered by tag push, for a semver versioning scheme 
              when version and previous-version inputs are provided.
              Previous version tag exists.
              Test expected to succeed.
            inputs: >-
                "versioning-scheme": "semver",
                "version": "v2.3.0",
                "previous-version": "v2.2.14",
                "prefix": "v"
            outcome: "success"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      
      - name: Description
        run: echo "${{ matrix.description }}"

      - name: Test
        id: test-action
        continue-on-error: true
        uses: jenseng/dynamic-uses@8bc24f0360175e710da532c4d19eafdbed489a06 #v1.1.1 - Needed because github context is not supported within step.uses (https://github.com/actions/runner/issues/895)
        with: 
          uses: ${{ github.repository }}/.github/actions/version-check@${{github.sha}}
          with: '{ ${{ matrix.inputs }} }'
    
      - name: Verify expected outcome
        if: always()
        run: |
          if [[ '${{ matrix.outcome }}' == '${{ steps.test-action.outcome }}' ]]; then
            exit 0
          else
            exit 1
          fi

  cleanup-tags:
    name: Cleanup test tags
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/')
    needs: test-action-tag-push-with-previous-version
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cleanup test tags
        if: always()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git push origin --delete "$TAG_NAME"
          git push origin --delete "$PREVIOUS_TAG_NAME"
          echo "::notice::Testing tags have been deleted"