name: cherry-pick

on:
  workflow_call:
# Accepted triggers:
#   issue_comment:
#     types: [created]

jobs:
  process_comment:
    # This job will parse the cherry-pick command and perform several sanity checks.
    # Ideally we want all pull requests opened from a given command to be correct and successfull, so that
    # developers don't have to reissue a cherry-pick command for a subset of the commits/branches.
    # Therefore, we do all possible sanity checks in this job, before any pull request is opened in subsequent jobs.
    if: github.event.issue.pull_request != '' && contains(github.event.comment.body, '!cherry-pick')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      commits: ${{ steps.command.outputs.commits }}
      branches: ${{ steps.command.outputs.branches }}
      branch_matrix: ${{ steps.command.outputs.branch_matrix }}
      status: ${{ steps.report.outputs.status }}
    steps:
      - name: Verify commenter permissions
        id: perms
        uses: $/.github/actions/commenter-permission-check
        with:
          minimum-permission: write

      - name: Error if no permissions
        if: steps.perms.outputs.has-permission == 'false'
        run: echo "ERROR_MSG=${{ github.actor }} does not have permission to run this comment command." >> "$GITHUB_ENV"

      - name: Checkout repository
        if: env.ERROR_MSG == ''
        uses: actions/checkout@v7
        with:
          # We need the history of all branches for the sanity checks
          fetch-depth: 0

      - name: Parse Command
        # Parse a command of the form:
        #
        #   !cherry-pick <hash_1> <hash_2> ... <hash_n> into <branch_1> <branch_2> ... <branch_n>
        #
        # and generate lists of commits and branches for further processing.
        #
        # TODO: make this step into a separate job, so that we can handle more than one command per comment
        id: command
        if: env.ERROR_MSG == ''
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -f
          # Comments written in the web UI usually have CRLF line endings, which would leave a trailing '\r' on the last token
          COMMENT_BODY=${COMMENT_BODY//$'\r'/}
          # Only accept the command at the start of a line, so prose mentioning cherry-pick isn't parsed as the command
          command_string=$(grep -m 1 -E '^[[:space:]]*!cherry-pick([[:space:]]|$)' <<< "$COMMENT_BODY" || true)
          echo "command=$command_string" >> $GITHUB_OUTPUT
          if [[ -z "$command_string" ]]; then
            echo "ERROR_MSG=No line starting with \`!cherry-pick\` was found in the comment." >> $GITHUB_ENV
            exit 0
          fi
          command=($command_string)
          command=("${command[@]:1}")

          has_separator=false
          arg_type=hash
          commits=()
          branches=()
          for token in ${command[@]}; do
            if [[ "$token" == "into" ]]; then
              arg_type=branch
              has_separator=true
            else
              if [[ "$arg_type" == "hash" ]]; then
                commits+=( $token )
              elif [[ "$arg_type" == "branch" ]]; then
                branches+=( $token )
              fi
            fi
          done

          # Check command correctness
          if [[ "$has_separator" = false ]]; then
            errors=$'\n- the command is missing the `into` separator.'
          else
            if [[ -z "$commits" ]]; then
              errors+=$'\n- no list of commits to cherry-pick was provided'
            fi
            if [[ -z "$branches" ]]; then
              errors+=$'\n- no list of target branches was provided'
            fi
          fi

          # Validate tokens, so only well-formed commit hashes and branch names reach later steps
          for commit in "${commits[@]}"; do
            if [[ ! "$commit" =~ ^[0-9a-f]{7,40}$ ]]; then
              invalid_commits+=" \`$commit\`"
            fi
          done
          if [[ -n "$invalid_commits" ]]; then
            errors+=$'\n'"- invalid commit hash(es):${invalid_commits}"
          fi
          for branch in "${branches[@]}"; do
            if ! git check-ref-format --branch "$branch" > /dev/null 2>&1; then
              invalid_branches+=" \`$branch\`"
            fi
          done
          if [[ -n "$invalid_branches" ]]; then
            errors+=$'\n'"- invalid branch name(s):${invalid_branches}"
          fi

          if [[ -n "$errors" ]]; then
            errors="Incorrect cherry-pick command:$errors"
            printf "ERROR_MSG<<EOF\n%s\nEOF" "$errors" >> $GITHUB_ENV
          else
            # Output lists of commits and branches
            echo "commits=${commits[@]}" >> $GITHUB_OUTPUT
            echo "branches=${branches[@]}" >> $GITHUB_OUTPUT

            # We also output the list of branches as json, so they can be used to generate a matrix for the next job
            echo "branch_matrix=$(jq -cn '$ARGS.positional' --args -- "${branches[@]}")" >> $GITHUB_OUTPUT
          fi

      - name: Check PR Status
        if: env.ERROR_MSG == ''
        run: |
          # Check if the PR has been merged
          if [[ -z "${{ github.event.issue.pull_request.merged_at }}" ]]; then
            echo "ERROR_MSG=Pull request has not been merged yet. Cannot cherry-pick commits." >> $GITHUB_ENV
          fi

      - name: Check commits
        if: env.ERROR_MSG == ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMITS: ${{ steps.command.outputs.commits }}
        run: |
          # Check that the commits to cherry-pick are actually part of this PRs target branch
          target=$(gh api repos/{owner}/{repo}/pulls/${{ github.event.issue.number }} -q .base.ref)
          for commit in $COMMITS; do
            if git merge-base --is-ancestor ${commit} origin/$target; then
              echo "Commit $commit found in $target branch."
            else
              missing_commits+=" \`$commit\`"
            fi
          done
          if [[ -n "$missing_commits" ]]; then
            echo "ERROR_MSG=Could not find commit(s)${missing_commits} in [$target](${{ github.server_url }}/${{ github.repository }}/tree/$target)." >> $GITHUB_ENV
          fi

      - name: Check Target Branches
        if: env.ERROR_MSG == ''
        env:
          BRANCHES: ${{ steps.command.outputs.branches }}
        run: |
          # Check that cherry-pick target branches actually exist
          for branch in $BRANCHES; do
            if [[ -n "$(git ls-remote --heads origin ${branch})" ]]; then
              echo "Found branch $branch in repository."
            else
              missing_branches+=" \`$branch\`"
            fi
          done
          if [[ -n "$missing_branches" ]]; then
            echo "ERROR_MSG=Could not find branch(es)${missing_branches} in repository." >> $GITHUB_ENV
          fi

      - name: Check Previous Cherry-picks
        if: env.ERROR_MSG == ''
        env:
          BRANCHES: ${{ steps.command.outputs.branches }}
        run: |
          # Check that branches with the cherry-picked commits have not been pushed to the remote yet
          for branch in $BRANCHES; do
            new_branch=cherry_pick_from_pr${{ github.event.issue.number }}_into_$branch
            if [[ -z "$(git ls-remote --heads origin $new_branch)" ]]; then
              echo "No previous attempt to cherry-pick commits from this PR into branch $branch found."
            else
              duplicated_branches+=" $branch"
            fi
          done
          if [[ -n "$duplicated_branches" ]]; then
            errors="It seems there are previous unfinished attempts to cherry-pick commits from this PR to the following branch(es):"
            for branch in $duplicated_branches; do
              errors+=$'\n'"- [$branch](${{ github.server_url }}/${{ github.repository }}/tree/$branch)"
            done
            errors+=$'\n\nIf the current cherry-pick attempt is for a different set of commits, make sure that the previous attempts are fully merged and that the corresponding branches have been deleted.'
            printf "ERROR_MSG<<EOF\n%s\nEOF" "$errors" >> $GITHUB_ENV
          fi

      - name: Status Report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND_TEXT: ${{ steps.command.outputs.command }}
          ERROR_MSG: ${{ env.ERROR_MSG }}
        run: |
          if [[ -n "$ERROR_MSG" ]]; then
            body="> ${COMMAND_TEXT}

          Automatic cherry-pick failed. ${ERROR_MSG}"
            gh pr comment ${{ github.event.issue.number }} --body "$body"
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

  create_pr:
    runs-on: ubuntu-latest
    needs: process_comment
    if: needs.process_comment.outputs.status == 'success'
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        branch: ${{ fromJson(needs.process_comment.outputs.branch_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # We need the history of all branches
          fetch-depth: 0

      - name: Import Commit-Signing Key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd  # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GH_ACTIONS_BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GH_ACTIONS_BOT_GPG_PASSPHRASE }}
          git_config_global: true
          git_committer_name: ${{ vars.GH_ACTIONS_BOT_GIT_USER_NAME }}
          git_committer_email: ${{ vars.GH_ACTIONS_BOT_GIT_USER_EMAIL }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Determine branch information
        id: info
        env:
          TARGET: ${{ matrix.branch }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          echo "new_branch=cherry_pick_from_pr${PR_NUMBER}_into_${TARGET}" >> "$GITHUB_OUTPUT"
          echo "target_branch_url=[${TARGET}](${REPO_URL}/tree/${TARGET})" >> "$GITHUB_OUTPUT"

      - name: Cherry-pick commits
        id: cherry-pick
        continue-on-error: true
        env:
          NEW_BRANCH: ${{ steps.info.outputs.new_branch }}
          TARGET: ${{ matrix.branch }}
          COMMITS: ${{ needs.process_comment.outputs.commits }}
        run: |
          read -ra commits <<< "$COMMITS"
          git checkout -b "$NEW_BRANCH" "origin/$TARGET"
          git cherry-pick "${commits[@]}"

      - name: Open pull request
        if: steps.cherry-pick.outcome == 'success'
        id: open_pr
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_BRANCH: ${{ steps.info.outputs.new_branch }}
          TARGET: ${{ matrix.branch }}
          TARGET_BRANCH_URL: ${{ steps.info.outputs.target_branch_url }}
          COMMITS: ${{ needs.process_comment.outputs.commits }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          git push --set-upstream origin "$NEW_BRANCH"
          url=$(gh pr create -B "$TARGET" -t "Cherry-pick commits from #${PR_NUMBER}" \
            -b "Cherry-picking commit(s) ${COMMITS} from #${PR_NUMBER} into ${TARGET_BRANCH_URL}.")
          echo "pr_url=$url" >> "$GITHUB_OUTPUT"

      - name: Report success
        if: steps.cherry-pick.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: |
            Automatic Git cherry-picking of commit(s) ${{ needs.process_comment.outputs.commits }} into ${{ steps.info.outputs.target_branch_url }} was successful.

            The new pull request can be reviewed and approved [here](${{ steps.open_pr.outputs.pr_url }}).
        run: |
          gh pr comment "${{ github.event.issue.number }}" --body "$BODY"

      - name: Manual cherry-pick instructions
        if: steps.cherry-pick.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: |
            Automatic Git cherry-picking of commit(s) ${{ needs.process_comment.outputs.commits }} into ${{ steps.info.outputs.target_branch_url }} failed. This usually happens when cherry-picking results in a conflict or an empty commit. To manually cherry-pick the commits and open a pull request, please follow these instructions:
             1. Create new branch from target branch:
            ```console
            git checkout ${{ matrix.branch }}
            git pull
            git checkout -b ${{ steps.info.outputs.new_branch }}
            ```
             2. Cherry-pick commits:
            ```console
            git cherry-pick ${{ needs.process_comment.outputs.commits }}
            ```
             3. Fix any conflicts and/or empty commits by following the instructions provided by Git.
             4. Push the new branch:
            ```console
            git push --set-upstream origin ${{ steps.info.outputs.new_branch }}
            ```
             5. Open a new pull request on github making sure the target branch is set to ${{ matrix.branch }}.
        run: |
          gh pr comment "${{ github.event.issue.number }}" --body "$BODY"
